<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="STM32F407 核心板 120 针接口（V0.8）交互引脚图：按外设查看可用引脚，查看每个脚的 GPIO 与复用功能。">
<title>F407 核心板引脚图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
/* 布局：明亮的产品摄影台，板子按真实几何居中渲染；J1 / J2 的 60 个脚以竖排标签排在板子上下，和焊盘列严格对齐；右侧是引脚详情，下方是可搜索的全表 */
:root {
  --bg: #f5f7fb;
  --bg-tint: #eaf1ff;
  --surface: #ffffff;
  --surface-2: #f3f6fb;
  --fg: #172033;
  --muted: #637089;
  --dim: #98a3b6;
  --line: #e2e8f2;
  --accent: #ff7a3d;
  --accent-soft: #fff0e8;
  --accent-ink: #ffffff;
  --focus: #2f6bff;
  --shadow: 0 1px 2px rgba(23, 32, 51, .04), 0 10px 30px rgba(31, 60, 120, .07);
  /* 板子材质（实物色，两种主题一致） */
  --fr4: #183a86;
  --cu: #2556b8;
  --cu-hi: #2c63c9;
  --pad-hi: #f1d27a;
  --pad-lo: #b48b34;
  --silk: #f6f6f0;
  --hole: #0b0e14;
  /* 功能分组色 */
  --g-gnd: #8a94a6; --g-p5v: #f04438; --g-p3v3: #f79009; --g-ref: #d444a3; --g-dbg: #e3367f;
  --g-uart: #12b5a0; --g-i2c: #2f6bff; --g-can: #6b5cff; --g-spi: #9b51e0; --g-pwm: #52b23a;
  --g-adc: #d4a106; --g-usb: #0ea5d9; --g-sdio: #c4703b; --g-eth: #3d8fd1; --g-fmc: #8a7bc2; --g-gpio: #7c8aa0;
  --font-head: "Space Grotesk", "Noto Sans SC", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141d; --bg-tint: #152036; --surface: #161d29; --surface-2: #1c2433; --fg: #e8edf6; --muted: #9aa6ba; --dim: #66728a; --line: #263042;
    --accent: #ff8a52; --accent-soft: #3a2418; --accent-ink: #1d0f06; --focus: #7aa2ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
    --g-gnd: #95a0b3; --g-p5v: #ff6b5e; --g-p3v3: #ffab45; --g-ref: #e783c2; --g-dbg: #f0679f; --g-uart: #34d1b6; --g-i2c: #6f9bff; --g-can: #998dff;
    --g-spi: #c08af0; --g-pwm: #84d066; --g-adc: #e8c43a; --g-usb: #45c8ec; --g-sdio: #e09a68; --g-eth: #7fb9e6; --g-fmc: #b3a6e0; --g-gpio: #a8b4c6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141d; --bg-tint: #152036; --surface: #161d29; --surface-2: #1c2433; --fg: #e8edf6; --muted: #9aa6ba; --dim: #66728a; --line: #263042;
  --accent: #ff8a52; --accent-soft: #3a2418; --accent-ink: #1d0f06; --focus: #7aa2ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
  --g-gnd: #95a0b3; --g-p5v: #ff6b5e; --g-p3v3: #ffab45; --g-ref: #e783c2; --g-dbg: #f0679f; --g-uart: #34d1b6; --g-i2c: #6f9bff; --g-can: #998dff;
  --g-spi: #c08af0; --g-pwm: #84d066; --g-adc: #e8c43a; --g-usb: #45c8ec; --g-sdio: #e09a68; --g-eth: #7fb9e6; --g-fmc: #b3a6e0; --g-gpio: #a8b4c6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  background: radial-gradient(900px 520px at 85% -10%, var(--bg-tint) 0%, transparent 70%), radial-gradient(800px 500px at -10% 30%, var(--bg-tint) 0%, transparent 65%), var(--bg);
}
.wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 28px; }
.brand { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--font-mono); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.kicker::before { content: ""; width: 18px; height: 2px; background: var(--accent); border-radius: 2px; }
.brand h1 { margin: 0; font: 700 clamp(28px, 4vw, 42px)/1.1 var(--font-head); letter-spacing: -0.02em; text-wrap: balance; }
.brand h1 span { color: var(--muted); font-weight: 500; }
.brand p { margin: 0; color: var(--muted); font-size: 14.5px; }
.brand p b { color: var(--fg); font-weight: 600; }
.ctrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.seg button { font: 500 13px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 7px 16px; border-radius: 9px; cursor: pointer; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.search { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 42px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; flex: 1 1 280px; max-width: 420px; border: 1px solid transparent; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font: 14px var(--font-body); }
.search input::placeholder { color: var(--dim); }
.search:focus-within { border-color: var(--focus); }
.search svg { color: var(--muted); flex: none; }
button:focus-visible, .lab:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { --g: var(--g-gpio); display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 13px var(--font-body); cursor: pointer; transition: background .2s, border-color .2s, transform .2s; }
.chip:hover { transform: translateY(-1px); border-color: var(--g); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.chip span { font: 11px var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--g); background: color-mix(in srgb, var(--g) 12%, var(--surface)); }
.chip.all[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--surface); }
.chip.all[aria-pressed="true"] span { color: var(--surface); opacity: .7; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stage-scroll { overflow-x: auto; overflow-y: hidden; border-radius: 24px; background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); box-shadow: var(--shadow); }
.stage { position: relative; margin: 0 auto; perspective: 1800px; }
.flip { position: absolute; transform-style: preserve-3d; transition: transform .38s cubic-bezier(.4, 0, .2, 1); }
.flip.turn { transform: rotateY(90deg); }
.flip canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#board { filter: drop-shadow(0 22px 28px rgba(24, 58, 134, .22)) drop-shadow(0 4px 6px rgba(24, 58, 134, .15)); }
.lab { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0; border: 0; background: none; color: var(--fg); cursor: pointer; }
.lab .nm { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 11px/1 var(--font-mono); white-space: nowrap; padding: 7px 0; border-radius: 6px; width: 100%; flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: flex-start; background: color-mix(in srgb, var(--g) 10%, var(--surface)); color: color-mix(in srgb, var(--g) 70%, var(--fg)); border: 1px solid color-mix(in srgb, var(--g) 28%, transparent); transition: background .18s, color .18s, transform .18s, opacity .18s, box-shadow .18s; }
.lab.down .nm { justify-content: flex-end; }
.lab .no { font: 500 10px/1 var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.lab .bar { width: 5px; height: 5px; border-radius: 50%; background: var(--g); }
.lab.gnd .nm { color: var(--dim); background: var(--surface-2); border-color: var(--line); font-weight: 400; }
.lab.gnd .bar { opacity: .5; }
.lab:hover .nm, .lab.hov .nm { background: color-mix(in srgb, var(--g) 22%, var(--surface)); border-color: var(--g); color: var(--fg); }
.lab.sel .nm { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.lab.sel .no { color: var(--accent); font-weight: 700; }
.lab.sel .bar { background: var(--accent); }
.lab.dim { opacity: .18; }
.tag { position: absolute; font: 700 22px/1 var(--font-head); color: var(--fg); display: flex; flex-direction: column; gap: 6px; }
.tag small { font: 12px var(--font-body); color: var(--muted); }
.rowtag { position: absolute; font: 11px var(--font-body); color: var(--dim); white-space: nowrap; }
#tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--surface); font: 600 12px var(--font-mono); padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 5; box-shadow: var(--shadow); }
#tip span { opacity: .7; font-weight: 400; }

.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border-radius: 20px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.eyebrow { font: 600 11.5px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.big { font: 700 26px/1.2 var(--font-mono); margin: 12px 0 12px; word-break: break-all; letter-spacing: -0.01em; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.badge { font: 12px var(--font-mono); padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.badge.g { --g: var(--g-gpio); background: color-mix(in srgb, var(--g) 14%, var(--surface)); color: color-mix(in srgb, var(--g) 75%, var(--fg)); font-family: var(--font-body); font-weight: 600; }
.kv { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 10px 14px; margin: 0; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv .mono { font-family: var(--font-mono); font-size: 13px; }
.go { font: 500 13px var(--font-mono); color: var(--focus); background: none; border: 0; padding: 0; cursor: pointer; }
.go:hover { text-decoration: underline; text-underline-offset: 3px; }
.copy { font: 500 12px var(--font-body); color: var(--fg); background: var(--surface-2); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.copy:hover { background: var(--accent-soft); color: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; margin-top: 14px; }
.fact b { display: block; font: 700 20px/1.2 var(--font-head); letter-spacing: -0.01em; }
.fact span { color: var(--muted); font-size: 12.5px; }

.tablecard { padding: 0; overflow: hidden; }
.tablehead { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tablehead h2 { margin: 0; font: 700 20px var(--font-head); letter-spacing: -0.01em; }
.tablehead span { color: var(--muted); font-size: 13px; }
.tablewrap { overflow-x: auto; max-height: 560px; overflow-y: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font: 600 11.5px var(--font-body); letter-spacing: .06em; text-align: left; padding: 11px 14px; white-space: nowrap; z-index: 1; border-bottom: 1px solid var(--line); }
td { padding: 9px 14px; border-top: 1px solid var(--line); white-space: nowrap; }
td.mono { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 240px; color: var(--muted); }
tr { cursor: pointer; transition: background .15s; }
tbody tr:hover { background: var(--surface-2); }
tr.sel td { background: var(--accent-soft); }
td .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--g); margin-right: 8px; vertical-align: 1px; }
footer { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 24px; }
footer b { color: var(--fg); font-weight: 600; }

@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
}
@media (max-width: 720px) { .side { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- V3：外设模式、复用功能列表、平面板图 ---- */
#board { filter: none; }
.chips-row { display: flex; flex-direction: column; gap: 10px; }
.chips-label { font: 600 11.5px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lab.cap .nm { background: color-mix(in srgb, var(--p) 16%, var(--surface)); border-color: var(--p); color: var(--fg); }
.lab.cap .bar { background: var(--p); }
.lab.cap.occ .nm { border-style: dashed; }
.per { --p: var(--g-gpio); }
.per-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 10px 0 4px; }
.per-head b { font: 700 22px/1.2 var(--font-head); letter-spacing: -0.01em; }
.per-head span { color: var(--muted); font-size: 12.5px; }
.per-note { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.inst-list { display: flex; flex-direction: column; gap: 12px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
.inst { border-top: 1px solid var(--line); padding-top: 10px; }
.inst h3 { margin: 0 0 6px; font: 700 13px var(--font-mono); color: color-mix(in srgb, var(--p) 75%, var(--fg)); }
.role { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; align-items: start; padding: 3px 0; }
.role > span { font: 12px var(--font-mono); color: var(--muted); padding-top: 3px; overflow-wrap: anywhere; }
.pins { display: flex; flex-wrap: wrap; gap: 5px; }
.pinbtn { font: 600 12px var(--font-mono); border: 1px solid color-mix(in srgb, var(--p) 40%, var(--line)); background: color-mix(in srgb, var(--p) 10%, var(--surface)); color: var(--fg); border-radius: 999px; padding: 2px 9px; cursor: pointer; white-space: nowrap; }
.pinbtn small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.pinbtn.occ { border-style: dashed; }
.pinbtn:hover, .pinbtn.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pinbtn:hover small, .pinbtn.sel small { color: var(--accent-ink); }
.afs { display: flex; flex-wrap: wrap; gap: 6px; }
.af { --p: var(--g-gpio); display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font-mono); padding: 3px 4px 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--p) 12%, var(--surface)); color: color-mix(in srgb, var(--p) 70%, var(--fg)); border: 1px solid color-mix(in srgb, var(--p) 30%, transparent); white-space: nowrap; cursor: pointer; }
.af i { font: 500 10.5px var(--font-mono); font-style: normal; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 1px 6px; }
.af:hover { border-color: var(--p); }
.warn { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--fg); font-size: 13px; }
.warn b { color: var(--accent); }
.gpio { font: 700 15px var(--font-mono); }
.gpio small { font: 12.5px var(--font-body); color: var(--muted); margin-left: 6px; }
td.afcell { white-space: normal; min-width: 260px; color: var(--muted); font: 12px var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="kicker">Pinout · Interface V0.8</span>
      <h1>STM32F407 核心板 <span>引脚图</span></h1>
      <p><b>STM32F407VGT6</b> · 120 针板对板接口 · 2 × (2×30P) 1.27mm · 65 × 50 mm</p>
    </div>
    <div class="ctrl">
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="搜索 PB6、USART1、I2C2_SDA、J1-51…" autocomplete="off">
      </label>
      <div class="seg" role="group" aria-label="视角">
        <button type="button" id="vTop" aria-pressed="true">正面</button>
        <button type="button" id="vBot" aria-pressed="false">背面（排母面）</button>
      </div>
    </div>
  </header>

  <div class="chips-row">
    <span class="chips-label">按外设查看：哪些脚可以用</span>
    <div class="chips" id="chips" role="group" aria-label="按外设查看"></div>
  </div>

  <div class="main">
    <div class="stage-scroll" id="scroller">
      <div class="stage" id="stage">
        <div class="flip" id="flip"><canvas id="board"></canvas><canvas id="fx"></canvas></div>
        <div id="labs"></div>
        <div id="tip" hidden></div>
      </div>
    </div>
    <aside class="side">
      <section class="card per" id="perCard" hidden></section>
      <section class="card" id="detail" aria-live="polite"></section>
    </aside>
  </div>

  <section class="card tablecard">
    <div class="tablehead"><h2>全部引脚</h2><span id="count">120 个引脚</span></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>编号</th><th>信号名</th><th>GPIO</th><th>推荐用途</th><th>可复用功能</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <span>复用功能取自 ST 官方 STM32CubeMX 引脚数据库（STM32F407VGTx）</span>
    <span>J1/J2 = BOOMELE 1.27-2*30P 立贴母 <b>C72530</b>，装在核心板背面 · 底板配 <b>C191721</b> 排针</span>
    <span>所有 IO 均为 3.3V 电平，底板不得灌入 5V</span>
  </footer>

  const pt = partner(p), same = PINS.filter(q => q.sig === p.sig && q.id !== p.id).map(q => q.id);
  const rows = [];
  if (p.mcu && p.port && p.port.startsWith('P')) rows.push(['GPIO', `<span class="gpio">${esc(p.port)}<small>LQFP100 第 ${p.mcu} 脚</small></span>`]);
  else if (p.mcu) rows.push(['MCU 引脚', `<span class="gpio">${esc(p.port)}<small>第 ${p.mcu} 脚</small></span>`]);
  rows.push(['推荐用途', esc(p.func || '—')]);
  if (p.afs.length) {
    rows.push(['可复用为', `<div class="afs">${p.afs.map(([s, a]) => { const k = perOf(s); return `<button type="button" class="af" style="--p:var(--g-${k ? PER[k].c : 'gpio'})" data-per="${k || ''}" title="${k ? '查看所有可做 ' + PER[k].n + ' 的脚' : ''}">${esc(s)}<i>${a >= 0 ? 'AF' + a : '模拟'}</i></button>`; }).join('')}</div>`]);
  }
  rows.push(['对面的脚', `<button class="go" type="button" data-go="${pt.id}">${pt.id}</button> ${esc(pt.sig)}`]);
  if (same.length) rows.push(['同网络', same.slice(0, 6).map(x => `<button class="go" type="button" data-go="${x}">${x}</button>`).join(' ') + (same.length > 6 ? ` 等 ${same.length} 个` : '')]);
  if (!p.mcu && p.note) rows.push(['说明', esc(p.note)]);
  const d = $('#detail');
  d.innerHTML = `<div class="eyebrow"><span>引脚详情</span><button class="copy" type="button" id="cp">复制信号名</button></div>
    <div class="big">${esc(p.sig)}</div>
    <div class="badges"><span class="badge">${p.id}</span><span class="badge">${p.n % 2 ? '奇数排 · 靠板边' : '偶数排 · 靠板内'}</span></div>
    <dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${OCC[p.port] ? `<div class="warn"><b>核心板已占用：</b>${esc(OCC[p.port])}。底板使用时注意不要冲突。</div>` : ''}
    ${p.mcu && p.note ? `<div class="warn" style="background:var(--surface-2)">${esc(p.note)}</div>` : ''}`;
  d.querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(b.dataset.go, true));
  d.querySelectorAll('.af[data-per]').forEach(b => b.onclick = () => { if (b.dataset.per) setPer(b.dataset.per); });
  const cp = $('#cp');
  cp.onclick = () => { const ok = () => { cp.textContent = '已复制'; setTimeout(() => cp.textContent = '复制信号名', 1400); }; try { navigator.clipboard.writeText(p.sig).then(ok, () => cp.textContent = p.sig); } catch (e) { cp.textContent = p.sig; } };
}
function fromHash() { const h = decodeURIComponent(location.hash.slice(1)).toUpperCase(); if (BYID[h]) { select(h, false); return true; } return false; }
window.addEventListener('hashchange', fromHash);

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
const start = () => { layout(); if (!fromHash()) select('J1-29', false); apply(); };
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 12px "JetBrains Mono"'), document.fonts.load('700 20px "Space Grotesk"')]).catch(() => {}) : Promise.resolve()).then(start, start);
</script>

</body>
